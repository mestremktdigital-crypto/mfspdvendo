name: Atualizar Dados de Mercado FIIs

on:
  schedule:
    # Execução principal: 21:10 (Horário de Brasília) de segunda a sexta.
    # BRT = UTC-3 sem horário de verão -> 21:10 BRT = 00:10 UTC do dia
    # seguinte -> em UTC isso cai em terça a sábado. Horário escolhido pra
    # garantir folga em relação à consolidação do Fundamentus (~21h).
    # Este cron também serve de rede de segurança pro disparo externo via
    # cron-job.org (workflow_dispatch) — se o externo falhar num dia, esta
    # tentativa via schedule ainda roda (com atraso possivelmente maior,
    # por cair perto da janela de pico do GitHub Actions perto da meia-noite
    # UTC).
    - cron: '10 0 * * 2-6'
    # Checagem de segurança: 04:00 (Horário de Brasília) de terça a sábado,
    # cobrindo o dia útil anterior. Só existe pra pegar os casos em que a
    # execução principal rodou com o Fundamentus fora do ar (ex: 18/08/2026).
    # Roda com ENABLE_BRAPI=false pra não gastar cota do plano free da brapi
    # nessa segunda tentativa. 04:00 BRT = 07:00 UTC do mesmo dia -> como a
    # execução principal de segunda cai na madrugada de terça, o range UTC
    # aqui é terça a sábado (2-6).
    - cron: '0 7 * * 2-6'
  workflow_dispatch:
    inputs:
      enable_brapi:
        description: 'Permitir fallback via brapi nesta execução manual?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar fiis.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          # Desliga a brapi automaticamente na execução agendada das 04h
          # (segundo cron acima). Na execução das 21h10 (schedule ou via
          # workflow_dispatch disparado pelo cron-job.org) e no disparo
          # manual, respeita o input/normal (default true).
          ENABLE_BRAPI: ${{ (github.event.schedule == '0 7 * * 2-6' && 'false') || (github.event.inputs.enable_brapi || 'true') }}
        run: python update_fiis.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiis.json
          git commit -m "auto: atualiza dados de mercado fiis.json [skip ci]" || echo "Nenhuma alteracao para commitar"
          git push
